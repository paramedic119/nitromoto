<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>MOTO MANIA — モトクロスレース</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud-left">
    <div id="time">0.0</div>
    <div id="best">BEST --.-</div>
  </div>

  <div id="hud-right">
    <div id="lap">LAP 1/3</div>
    <div id="pos">2nd</div>
    <div id="speed">0 km/h</div>
  </div>

  <div id="turbo-bar"><div id="turbo-fill"></div></div>

  <!-- 画面操作（スマホ）。左=リーン、右=アクセル/ターボ -->
  <div id="pad-left">
    <button id="btn-up" class="pad-btn" aria-label="後傾">▲</button>
    <button id="btn-down" class="pad-btn" aria-label="前傾">▼</button>
  </div>
  <div id="pad-right">
    <button id="btn-turbo" class="pad-btn turbo" aria-label="ターボ">T</button>
    <button id="btn-accel" class="pad-btn accel" aria-label="アクセル">GO</button>
  </div>

  <div id="countdown" class="show">3</div>

  <div id="result">
    <div class="result-card">
      <div id="result-title" class="result-title win">WIN!</div>
      <div id="result-sub" class="result-sub">1st</div>
      <div id="result-new" class="result-newbest">★ NEW RECORD! ★</div>
      <div class="result-row">タイム <span id="result-time">0.0</span></div>
      <div class="result-row">ベスト <span id="result-best-time">--.-</span></div>
      <div class="result-tap">タップ / Enter で再レース</div>
    </div>
  </div>

  <div id="rotate">📱 よこ向きでプレイしてね</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
