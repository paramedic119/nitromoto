<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2a4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>NITRO MOTO — タイムアタック</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud-left">
    <div id="time">0.0</div>
    <div id="best">BEST --.-</div>
  </div>

  <div id="hud-right">
    <div id="lap">LAP 1/2</div>
    <div id="speed">0 km/h</div>
  </div>

  <div id="turbo-bar"><div id="turbo-fill"></div></div>

  <div id="hint">タップ＆ホールドでターボ加速</div>

  <div id="result">
    <div class="result-card">
      <div id="result-title" class="result-title">GOAL!</div>
      <div id="result-new" class="result-newbest">★ NEW RECORD! ★</div>
      <div class="result-row">タイム <span id="result-time">0.0</span></div>
      <div class="result-row">ベスト <span id="result-best-time">--.-</span></div>
      <div class="result-tap">タップで再挑戦</div>
    </div>
  </div>

  <div id="rotate">📱 よこ向きでプレイしてね</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
